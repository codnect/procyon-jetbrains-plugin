  <ellipse cx="522" cy="92" rx="40" ry="20" transform="rotate(-25 522 92)" fill="#3B95F7"/>
  <ellipse cx="566" cy="100" rx="34" ry="14" transform="rotate(-8 566 100)" fill="#3B95F7"/>

